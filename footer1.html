<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        footer {
            background-color: #171515;
            color: beige;
            padding: 50px 5vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo img {
            height: 90px;
            width: 90px;
        }

        .visit {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .visit img {
            height: 90px;
            width: 90px;
            margin-right: 20px;
        }

        .contact h3 {
            font-size: 20px;
            margin: 0;
            padding-bottom: 10px;
        }

        .contact h3 a {
            color: #fff;
            text-decoration: none;
        }

        .contact h1 {
            font-size: 18px;
            margin: 20px 0;
        }

        .add {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .add img {
            height: 20px;
            width: 20px;
            margin-right: 10px;
        }

        .add h2 {
            font-size: 16px;
            margin: 0;
        }
    </style>
</head>
<body>

<footer>
    <div class="logo">
        <img src="LOGO.png" alt="Logo">
    </div>
    <div class="visit" id="contact">
        <div class="contact">
            <h3>Visit our official website <br><a href="https://www.jecjabalpur.ac.in/">jabalpur-engineering-college</a></h3>
            <h1>CONTACT US</h1>
            <div class="add">
                <img src="location icon.jpeg.jpg" alt="Location Icon">
                <h2>JEC, Gokalpur, Jabalpur, M.P</h2>
            </div>
            <div class="add">
                <img src="phone-icon.jpg" alt="Phone Icon">
                <h2>91-761-2331953</h2>
            </div>
            <div class="add">
                <img src="email icon.png" alt="Email Icon">
                <h2>prinjec.jbp@mp.gov.in</h2>
            </div>
        </div>
    </div>
</footer>

</body>
</html>
